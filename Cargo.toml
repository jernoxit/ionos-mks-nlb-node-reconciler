[package]
name = "ionos-mks-nlb-node-reconciler"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
description = "Kubernetes controller that keeps an IONOS Network Load Balancer's forwarding-rule targets in sync with the cluster's Ready nodes (private target-LAN IPs)."
repository = "https://github.com/jernoxit/ionos-mks-nlb-node-reconciler"
homepage = "https://github.com/jernoxit/ionos-mks-nlb-node-reconciler"
readme = "README.md"
keywords = ["kubernetes", "ionos", "load-balancer", "controller", "reconciler"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "nlb-reconciler"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util"] }
tokio-util = "0.7" # CancellationToken (shut down even during debounce/reconcile)
futures = "0.3"
# kube 4.0 requires k8s-openapi ^0.28; the k8s-openapi feature = the exact cluster
# API version (the core/v1 Node type is stable, so this is not tied to your cluster).
kube = { version = "4.0", default-features = false, features = ["client", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.28", features = ["v1_34"] }
# rustls TLS (via reqwest's rustls-platform-verifier); the distroless/cc runtime
# ships ca-certificates, so no explicit root store is needed.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# Small, fast-linking release for a long-running control-loop binary.
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "debuginfo"
