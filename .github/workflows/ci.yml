name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Kept in lockstep with rust-toolchain.toml + the Dockerfile RUST_VERSION by Renovate.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # PR caches are isolated and evicted on close — only main's cache is
          # ever reused, so only main should pay the save.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache (also speeds up dep builds under clippy)
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: build
        run: cargo build --release --locked

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: helm lint
        run: |
          helm lint charts/ionos-mks-nlb-node-reconciler \
            --set config.datacenterId=00000000-0000-0000-0000-000000000000 \
            --set config.nlbId=00000000-0000-0000-0000-000000000000 \
            --set config.targetLanId=1 \
            --set 'config.ruleIds={00000000-0000-0000-0000-000000000000}' \
            --set token.value=dummy
      - name: helm template (render with dummy required values)
        run: |
          helm template t charts/ionos-mks-nlb-node-reconciler \
            --set config.datacenterId=00000000-0000-0000-0000-000000000000 \
            --set config.nlbId=00000000-0000-0000-0000-000000000000 \
            --set config.targetLanId=1 \
            --set 'config.ruleIds={00000000-0000-0000-0000-000000000000}' \
            --set token.value=dummy > /dev/null

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # buildcache push on main (PR builds only read)
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # sccache inside the image build: export the runner's GHA cache
      # endpoint/token as env; passed into the build as BuildKit secrets below.
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Login to GHCR (buildcache push; PR builds don't push)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          secret-envs: |
            actions_results_url=ACTIONS_RESULTS_URL
            actions_runtime_token=ACTIONS_RUNTIME_TOKEN
          # Layer cache across runs — content-hashed, so it can never serve a
          # stale layer. mode=max also caches the dependency stage.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:image
          # Only WRITE the cache on a push to main. PR builds read main's warm
          # cache but must not write (isolated + evicted anyway).
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/{0}/buildcache:image,mode=max', github.repository) || '' }}
