{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Cluster-scoped + release-namespace-suffixed so multiple installs don't collide.
  name: {{ include "reconciler.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "reconciler.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "reconciler.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "reconciler.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "reconciler.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "reconciler.fullname" . }}-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
